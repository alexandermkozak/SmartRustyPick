# Default configuration used when /data/config.toml does not exist yet.
# Bind to all interfaces so the port can be published from the container.
server_addr = "0.0.0.0"
server_port = 8443
cert_path = "server.crt"
key_path = "server.key"
ca_path = "ca.crt"
editor = "nano"

# Web management dashboard. Bound to all interfaces so the published port
# reaches it; the access token is printed in the container log on every start.
web_addr = "0.0.0.0"
web_port = 8080
