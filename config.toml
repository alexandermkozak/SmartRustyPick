server_addr = "127.0.0.1"
server_port = 8443
# Generated on first start if missing, together with the CA key next to `ca.crt`.
# `.local/` is the single ignored directory for developer scratch.
cert_path = ".local/certs/server.crt"
key_path = ".local/certs/server.key"
ca_path = ".local/certs/ca.crt"
editor = "nano"

# Storage engine settings (optional)
# records_per_group = 16
# max_loaded_tables = 64
# durable_writes = false
# How much of a flush is forced to the disk: "never" (default), "meta" or
# "always". Files marked DURABLE use "always" unless this is set explicitly.
# fsync = "never"
# flush_interval_ms = 250
# flush_max_pending = 256

# Web management dashboard (optional). On by default, on the loopback interface.
# The access token is generated on every boot and printed with the URL unless one
# is set here. See docs/web_dashboard.md.
# web_enabled = true
# web_addr = "127.0.0.1"
# web_port = 8080
# web_token = ""
