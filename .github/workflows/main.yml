name: Build, Test and Publish

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job below. `test` widens it by exactly the one scope it
# needs; nothing here inherits whatever the repository default happens to be.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep the CI signal about correctness rather than raw throughput: a smaller
  # volume still exercises every query shape on the shared runners.
  SRP_PERF_RECORDS: 2000
  # Shared runners are slower and noisier than a workstation.
  SRP_STARTUP_TIMEOUT: 60
  # Latency budgets are calibrated on a workstation; give the runners room so the
  # absolute ceilings do not turn into flaky failures. The ratio-based checks, which
  # are the real regression guards, are unaffected by how fast the host is.
  SRP_PERF_BUDGET_SCALE: 4
  # Runners have 2 cores; oversubscribing them only measures the scheduler.
  SRP_CONC_CLIENTS: 4

jobs:
  # Cheap, fails fast, and independent of the test job, so it runs beside it
  # rather than in front of it. `cargo fmt` and `cargo audit` need no build at
  # all; clippy needs a check build, which is why this is not folded into
  # `test` - there it would have to wait for one.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      # Formatting first: it is the fastest check and the one most likely to be
      # the only thing wrong, so a failure here does not wait on clippy.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all-targets` so tests, benches and examples are linted too; they are
      # where lint rot usually starts.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A prebuilt binary rather than `cargo install cargo-audit`, which is a
      # three-minute compile the cache does not cover. Not rustsec/audit-check:
      # that action still runs on Node 20 and would put the deprecation warning
      # this repository just cleared (#30) straight back onto every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on vulnerabilities. Unmaintained-crate warnings are printed but do
      # not fail the job: they are a plan-a-replacement signal, not a stop-work
      # one, and they appear without any change of ours having caused them.
      - name: Audit dependencies
        run: cargo audit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Needed only by the step that publishes the performance report onto the
    # pull request; everything else in this job reads.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Show tool versions
        run: |
          cargo --version
          python3 --version
          openssl version

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Run unit tests
        run: make test-unit

      # Unit tests build their fixtures under the OS temp dir now (see
      # crates/core/src/test_support.rs), not inside the working copy. This
      # makes that invariant permanent instead of a habit: a test that regresses
      # to a CWD-relative fixture directory fails the build here.
      - name: Verify unit tests left the working copy clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::cargo test left files in the working copy:"
            git status --porcelain
            exit 1
          fi

      - name: Run integration tests
        run: make test-integration

      - name: Run performance tests
        run: make test-performance

      # A pull request's numbers mean little on their own - shared runners vary
      # far more than a real regression usually does - so compare them against
      # the last run on `main`. The cache is the transport: a pull request can
      # read entries written on its base branch, and `restore-keys` picks the
      # newest one whose key starts with the prefix, so no run has to know which
      # commit produced the baseline.
      - name: Restore the performance baseline from the base branch
        id: perf-baseline
        if: always() && github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: target/perf-baseline
          # Deliberately a key no run ever writes, so this always falls through
          # to restore-keys and takes the most recent baseline rather than an
          # exact-commit match that would almost never exist.
          key: perf-baseline-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: |
            perf-baseline-${{ github.base_ref }}-

      # Advisory, by design. `compare_perf.py` exits non-zero past its tolerance,
      # and `|| true` keeps that from failing the job: until the false-positive
      # rate on these runners is known, the table is worth reading and the
      # verdict is not worth blocking a merge on. Turning this into a gate later
      # is deleting `|| true` and picking a threshold.
      - name: Compare performance against the base branch
        if: >-
          always() && github.event_name == 'pull_request'
          && hashFiles('target/perf-baseline/performance_metrics.json') != ''
          && hashFiles('target/test-results/performance_metrics.json') != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "### Change against \`$BASE_REF\`"
            echo
            python3 scripts/compare_perf.py \
              target/perf-baseline/performance_metrics.json \
              target/test-results/performance_metrics.json \
              --tolerance 50 2>&1 || true
            echo
            echo "_Advisory only: shared runners are noisy, so a verdict here does not fail the build._"
          } > target/test-results/perf-delta.md
          cat target/test-results/perf-delta.md

      # The suites already record every measurement to performance_metrics.json.
      # These two steps put that file where it can be read without opening the run:
      # the run summary, and a single comment on the pull request that is rewritten
      # on each push. They run even when the suite failed, because a run that blew a
      # budget is exactly the run whose numbers are worth reading.
      - name: Render the performance report
        if: always() && hashFiles('target/test-results/performance_metrics.json') != ''
        run: |
          python3 scripts/report_perf.py \
            --footer "[Full workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - performance suite: ${{ job.status }}" \
            --output target/test-results/perf-report.md
          # The delta against the base branch, when there was a baseline to compare
          # against, goes into the same report: one thing to read, not two.
          if [ -f target/test-results/perf-delta.md ]; then
            { echo; cat target/test-results/perf-delta.md; } >> target/test-results/perf-report.md
          fi
          cat target/test-results/perf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the performance report on the pull request
        # Skipped for pull requests from forks: their token is read-only, so the
        # comment would fail the job for a contributor who cannot fix it. The report
        # is still in the run summary and the uploaded artifact.
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('target/test-results/perf-report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Identifies the comment this workflow owns, so each push rewrites it in
          # place instead of burying the pull request under one comment per run.
          marker='<!-- smart-rusty-pick: performance report -->'
          { echo "$marker"; cat target/test-results/perf-report.md; } > "$RUNNER_TEMP/comment.md"
          jq -Rs '{body: .}' "$RUNNER_TEMP/comment.md" > "$RUNNER_TEMP/payload.json"

          # Listed into a file and checked on its own line: a failed assignment from a
          # command substitution does not trip `set -e`, and treating an API error as
          # "no comment yet" would post a duplicate on every push instead of failing.
          if ! gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
               > "$RUNNER_TEMP/comments.json"; then
            echo "::error::Could not list the pull request's comments."
            exit 1
          fi
          # `--paginate` concatenates one array per page, so slurp and merge before
          # searching: on a busy pull request the comment can be past the first page.
          comment_id=$(jq -r -s --arg marker "$marker" \
            'add | map(select(.body | startswith($marker))) | .[0].id // empty' \
            "$RUNNER_TEMP/comments.json")

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input "$RUNNER_TEMP/payload.json" --silent
            echo "Updated comment $comment_id."
          else
            gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/payload.json" --silent
            echo "Created a new performance comment."
          fi

      # One iteration of each Criterion benchmark. Not a timing gate - it keeps the
      # benchmarks compiling and running, which is how benchmark suites usually rot.
      - name: Smoke-run the engine benchmarks
        run: make bench-smoke

      # Only `main` writes a baseline, so a pull request always compares against
      # its merge target rather than whatever branch happened to run last. The
      # key carries the commit, which makes every push a new entry and lets the
      # restore above take the newest. It is staged into its own directory
      # because restoring it on a pull request must not land on top of that
      # run's own metrics.
      - name: Stage the performance baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('target/test-results/performance_metrics.json') != ''
        run: |
          mkdir -p target/perf-baseline
          cp target/test-results/performance_metrics.json target/perf-baseline/

      - name: Save the performance baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('target/perf-baseline/performance_metrics.json') != ''
        uses: actions/cache/save@v4
        with:
          path: target/perf-baseline
          key: perf-baseline-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: target/test-results/
          if-no-files-found: warn

  # The dashboard's Vue bundle is committed so that `cargo build` needs no node
  # toolchain. That only stays true if the committed copy actually matches the
  # sources, which is what this job proves: rebuild it, and fail if the result
  # differs from what is in the repository.
  dashboard-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      UI_DIR: crates/core/src/web/ui
      DIST_DIR: crates/core/src/web/assets/dist

    steps:
      - uses: actions/checkout@v5

      # The node version stays pinned rather than tracking 'lts/*'. This job
      # asserts that the committed bundle is byte-for-byte what the sources
      # build, so the toolchain that builds it is part of the comparison:
      # floating it would turn a node release into a stale-bundle failure on an
      # unrelated pull request.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/core/src/web/ui/package-lock.json

      # The `ui-*` Makefile targets each run `npm ci` so that they work from a
      # clean checkout, which is right locally and redundant here. CI installs
      # once and calls the npm scripts those targets wrap.
      - name: Install the dashboard's dependencies
        run: npm ci
        working-directory: crates/core/src/web/ui

      - name: Check the dashboard front end's formatting
        run: npm run format:check
        working-directory: crates/core/src/web/ui

      - name: Test the dashboard front end
        run: npm test
        working-directory: crates/core/src/web/ui

      - name: Rebuild the dashboard bundle
        run: npm run build
        working-directory: crates/core/src/web/ui

      - name: Fail if the committed bundle is stale
        run: |
          # `git status --porcelain`, not `git diff`: a rebuild that emits a *new*
          # file - a renamed hashed chunk, an added asset - leaves it untracked,
          # and `git diff` compares only tracked files, so it would report clean.
          changed=$(git status --porcelain -- "$DIST_DIR")
          if [ -n "$changed" ]; then
            echo "::error::The committed dashboard bundle does not match $UI_DIR."
            echo "$changed"
            echo "Run 'make ui-build' and commit $DIST_DIR."
            exit 1
          fi

  # Publishes the runtime image to GitHub Packages (ghcr.io).
  #
  # It lives in this workflow rather than one of its own so that `needs:` can do
  # the gating. `main` is not branch protected, so a merge can land without this
  # workflow ever having passed on it - and `latest` naming a commit whose tests
  # failed is exactly what a published image must never be. A separate workflow
  # would have to be started by `workflow_run` and re-derive from the event what
  # it is allowed to publish; this cannot get that wrong.
  #
  # A pull request builds and smoke-tests the image without pushing anything.
  # The Containerfile is otherwise exercised for the first time after a merge,
  # which is the wrong moment to find out that the build no longer works.
  publish-container:
    needs: [lint, test, dashboard-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Writing the package, and attesting to what produced it.
      packages: write
      id-token: write
      attestations: write

    env:
      REGISTRY: ghcr.io
      # Port the smoke test publishes the dashboard on. Not 8080: the runner is
      # shared with whatever else a job has started.
      SMOKE_WEB_PORT: 18080
      SMOKE_TOKEN: smoke-test-token

    steps:
      - uses: actions/checkout@v5

      # `github.repository` carries the repository's own capitalisation and a
      # registry path may not, so the name is lowered once here rather than in
      # each of the three places that need it.
      - name: Name the image
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Skipped on a pull request, which pushes nothing - and whose token from a
      # fork could not log in anyway.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags, and they answer different questions. `latest` is "what is on
      # main now"; `sha-<commit>` is immutable, so a deployment can name exactly
      # what it is running and a rollback has something to name. There is no
      # version tag because the crates carry a version nobody bumps - one would
      # be a lie that moves.
      - name: Work out the tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=SmartRustyPick
            org.opencontainers.image.description=A PICK-like MultiValue database server, with a web management dashboard.

      # Built into the local daemon first so the smoke test below runs against
      # the very image that is about to be pushed, rather than against a second
      # build of the same source. `load` is what makes that possible, and is why
      # this is one architecture: a multi-platform build cannot be loaded, and
      # arm64 under emulation would put a Rust release build on QEMU.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image has to start, not merely build. This asks it the one question
      # that covers the whole stack at once: the dashboard is an ordinary remote
      # client, so an authorized `/api/accounts` answering `SYSTEM` proves the
      # entrypoint seeded /data, openssl generated the CA and server
      # certificates, the TLS listener came up, the dashboard's own certificate
      # was authorized, and the engine opened the database and answered a
      # command over the protocol.
      - name: Smoke-test the image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail

          docker run -d --name srp-smoke \
            -e SRP_WEB_TOKEN="$SMOKE_TOKEN" \
            -p "$SMOKE_WEB_PORT:8080" \
            "$IMAGE"

          # First start generates a CA and two certificates, so this is not
          # instant. Polled rather than slept through: the point is to fail with
          # the container's log, not to guess how long a runner takes.
          dashboard="http://127.0.0.1:$SMOKE_WEB_PORT/api/accounts"
          for _ in $(seq 1 60); do
            # `-fs` rather than `-fsS`: every attempt before the server is up
            # fails by design, and printing each one buries the real failure.
            code=$(curl -fs -o "$RUNNER_TEMP/accounts.json" -w '%{http_code}' \
                     -H "Authorization: Bearer $SMOKE_TOKEN" "$dashboard" || true)
            [ "$code" = "200" ] && break
            sleep 2
          done

          if [ "${code:-}" != "200" ]; then
            echo "::error::The image did not answer on the dashboard within two minutes."
            exit 1
          fi

          # SYSTEM holds the account registry and the authorized clients, so a
          # database that answers without it is one that did not really open.
          if ! grep -q '"SYSTEM"' "$RUNNER_TEMP/accounts.json"; then
            echo "::error::The dashboard answered without the SYSTEM account:"
            cat "$RUNNER_TEMP/accounts.json"
            exit 1
          fi

          # And the token is load-bearing rather than decorative.
          unauthorized=$(curl -s -o /dev/null -w '%{http_code}' "$dashboard")
          if [ "$unauthorized" != "401" ]; then
            echo "::error::The dashboard answered $unauthorized without a token, expected 401."
            exit 1
          fi

          # The CLI ships beside the server and `make container-cli` runs it.
          # Tested for rather than run: starting it attaches a second database
          # service to the same data directory.
          docker exec srp-smoke sh -c 'test -x /usr/local/bin/smart-rusty-pick-cli'

          echo "The image starts, serves the protocol and opens its database."

      - name: Show the container log
        if: failure()
        run: docker logs srp-smoke || true

      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f srp-smoke || true

      # A second call rather than a rebuild: every layer is already in this
      # job's builder, so this resolves from cache and pushes. It also hands
      # back the digest, which is what the attestation has to name - a tag can
      # move, a digest cannot.
      - name: Push the image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Signed provenance: which workflow, from which commit, built this exact
      # digest. `docs/security.md` states what this deployment trusts, and "the
      # image came from this repository" is worth being able to check rather
      # than assume.
      - name: Attest the image's provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Say what was published
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
