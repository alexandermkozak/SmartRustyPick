# .github/workflows/code-review.yml
name: Code Review

on:
  workflow_dispatch:
    
#  pull_request:
#    types: [ opened, synchronize ]

# Three pushes to a pull request used to start three reviews and let the first
# two run to completion - paid API calls for output nobody reads, since only the
# review of the final commit is interesting. Same group and policy as
# `Build and Test`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: JetBrains/junie-github-action@v1
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          # Update the same comment on subsequent Junie runs instead of adding new comments
          use_single_comment: true
          # Alternatively, write your custom review instructions in the prompt field
          # instead of using the built-in "code-review" value
          prompt: "code-review"
